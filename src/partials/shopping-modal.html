<div class="backdrop shopping-backdrop is-hidden" id="shopping-modal">
  <div class="modal shopping-modal">
    <button class="modal-close shopping-modal-close" type="button" aria-label="Close shopping list">
      <svg class="modal-close-icon" width="24" height="24" aria-hidden="true">
        <use href="./images/icons.svg#x"></use>
      </svg>
    </button>
    <h2 class="shopping-modal-title" data-i18n="shopping_title">Shopping list</h2>
    <button class="books-more-btn shopping-buy-btn is-hidden" type="button" data-i18n="shopping_buy_all">Buy all</button>
    <ul class="shopping-list"></ul>
    <ul class="shopping-pagination"></ul>
  </div>
</div>
