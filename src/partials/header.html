<header class="header" id="header">
  <div class="container header-container">
    <nav class="header-nav">
      <a
        class="header-logo"
        href="./index.html"
        aria-label="Booksy — go to homepage"
      >
        <svg class="header-logo-icon" width="83" height="21">
          <use href="./images/icons.svg#logo"></use>
        </svg>
      </a>

      <ul class="header-nav-list">
        <li class="header-nav-item">
          <a class="header-nav-link" href="#home" data-i18n="nav_home">Home</a>
        </li>
        <li class="header-nav-item">
          <a class="header-nav-link" href="#books" data-i18n="nav_books">Books</a>
        </li>
        <li class="header-nav-item">
          <a class="header-nav-link" href="#feedbacks" data-i18n="nav_feedbacks">Feedbacks</a>
        </li>
        <li class="header-nav-item">
          <a class="header-nav-link" href="#events" data-i18n="nav_events">Events</a>
        </li>
        <li class="header-nav-item">
          <a class="header-nav-link" href="#location" data-i18n="nav_location">Location</a>
        </li>
      </ul>
    </nav>
    <div class="header-actions">
      <div class="lang-switcher" role="group" aria-label="Language switcher">
        <button class="lang-btn is-active" type="button" data-lang="en">EN</button>
        <button class="lang-btn" type="button" data-lang="uk">UA</button>
      </div>
      <button
        class="shopping-open-btn"
        type="button"
        data-shopping-open
        aria-label="Cart"
        data-i18n-aria="nav_cart"
      >
        <svg
          class="shopping-cart-icon"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="shopping-open-text" data-i18n="nav_cart">Cart</span>
        <span class="shopping-cart-badge is-hidden" data-cart-count>0</span>
      </button>
      <button
        class="burger-btn"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
        data-menu-open
      >
        <svg class="burger-icon" width="24" height="24" aria-hidden="true">
          <use href="./images/icons.svg#menu-alt-right"></use>
        </svg>
      </button>
    </div>
  </div>
</header>
